[project]
name = "wealthdata"
version = "0.1.0"
description = "Backtest of aging Survey of Consumer Finances wealth microdata between waves with Financial Accounts aggregates."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Max Ghenis", email = "mghenis@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
report = ["matplotlib>=3.9", "jupyter>=1.1", "tabulate>=0.9"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scf: needs the SCF summary extracts (downloaded from the Federal Reserve and cached)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
